  # ============================================================
  # GPU Instance
  # ============================================================
  GPUInstance:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !If
          - Use32EFA
          - !Ref GPULaunchTemplate32EFA
          - !Ref GPULaunchTemplate16EFA
        Version: !If
          - Use32EFA
          - !GetAtt GPULaunchTemplate32EFA.LatestVersionNumber
          - !GetAtt GPULaunchTemplate16EFA.LatestVersionNumber

Outputs:
  SubnetId:
    Value: !Ref Subnet
    Export:
      Name: !Sub '${AWS::StackName}-SubnetId'

  SecurityGroupId:
    Value: !Ref EFASecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-SecurityGroupId'

  InstanceId:
    Description: GPU Instance ID
    Value: !Ref GPUInstance

  InstancePublicIP:
    Description: Run this to get the public IP
    Value: !Sub 'aws ec2 describe-instances --instance-ids ${GPUInstance} --query Reservations[0].Instances[0].PublicIpAddress --output text --region ${AWS::Region}'

  SSHCommand:
    Value: !Sub 'ssh -i ${KeyPairName}.pem ubuntu@<PUBLIC_IP>'
