            Groups: [!Ref EFASecurityGroup]
            InterfaceType: efa-only
            DeleteOnTermination: true
          - DeviceIndex: 1
            NetworkCardIndex: 4
            SubnetId: !Ref Subnet
            Groups: [!Ref EFASecurityGroup]
            InterfaceType: efa-only
            DeleteOnTermination: true
          - DeviceIndex: 1
            NetworkCardIndex: 5
