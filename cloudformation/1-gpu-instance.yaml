            Groups: [!Ref EFASecurityGroup]
            InterfaceType: efa-only
            DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub '${AWS::StackName}-gpu-instance'

  # ============================================================
  # GPU Launch Template — 32 EFA interfaces (P6e)
